<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="theme-color" content="#0a0a0f">
<title>Login — Learn X Community</title>
<link rel="icon" type="image/png" href="images/LOGO_1.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:'Inter',sans-serif;
    background:#0a0a0f;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:0;
    position:relative;
  }
  .bg-scene{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:0;
  }
  .bg-orb{
    position:absolute;
    border-radius:50%;
    filter:blur(80px);
    opacity:.55;
    animation:float 14s ease-in-out infinite;
  }
  .bg-orb.o1{width:420px;height:420px;background:radial-gradient(circle,rgba(255,107,0,.35),transparent 70%);top:-10%;left:-10%;animation-delay:0s}
  .bg-orb.o2{width:360px;height:360px;background:radial-gradient(circle,rgba(255,143,31,.25),transparent 70%);bottom:-15%;right:-12%;animation-delay:-4s}
  .bg-orb.o3{width:300px;height:300px;background:radial-gradient(circle,rgba(255,107,0,.15),transparent 70%);top:50%;left:50%;transform:translate(-50%,-50%);animation-delay:-8s}
  .bg-grid{
    position:absolute;
    inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);
    background-size:60px 60px;
    mask-image:radial-gradient(ellipse 60% 60% at 50% 50%,#000,transparent);
    -webkit-mask-image:radial-gradient(ellipse 60% 60% at 50% 50%,#000,transparent);
  }
  @keyframes float{
    0%,100%{transform:translate(0,0) scale(1)}
    33%{transform:translate(30px,-30px) scale(1.05)}
    66%{transform:translate(-20px,20px) scale(.95)}
  }
  .auth-loader{position:fixed;inset:0;z-index:99999;display:grid;place-items:center;gap:16px;background:#0a0a0f;transition:opacity .45s ease,visibility .45s}
  .auth-loader.hidden{opacity:0;visibility:hidden;pointer-events:none}
  .auth-ring{width:48px;height:48px;border-radius:50%;border:4px solid rgba(255,106,26,.18);border-top-color:#FF8F1F;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .auth-logo-mark{font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:1.2rem;letter-spacing:-.5px;color:#fff}
  .auth-logo-mark span{background:linear-gradient(110deg,#FF8F1F,#FF6B00);-webkit-background-clip:text;background-clip:text;color:transparent}
  .auth-wrapper{
    width:100%;
    max-width:460px;
    padding:20px;
    position:relative;
    z-index:1;
    animation:slideUp .8s cubic-bezier(.16,1,.3,1) both;
  }
  @keyframes slideUp{
    from{opacity:0;transform:translateY(30px)}
    to{opacity:1;transform:translateY(0)}
  }
  .auth-logo{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:24px;
    text-decoration:none;
    justify-content:center;
    animation:slideUp .8s .1s cubic-bezier(.16,1,.3,1) both;
  }
  .auth-logo img{height:28px;width:auto;border-radius:6px;filter:drop-shadow(0 4px 12px rgba(255,107,0,.35))}
  .auth-logo span{font-family:'Space Grotesk',sans-serif;font-size:.95rem;font-weight:700;color:#fff;letter-spacing:-.3px}
  .auth-card{
    background:rgba(255,255,255,.04);
    backdrop-filter:blur(40px) saturate(180%);
    -webkit-backdrop-filter:blur(40px) saturate(180%);
    border:1px solid rgba(255,255,255,.08);
    border-radius:24px;
    padding:36px 32px 32px;
    position:relative;
    overflow:hidden;
    box-shadow:0 8px 32px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.05) inset;
    animation:slideUp .8s .2s cubic-bezier(.16,1,.3,1) both;
  }
  .auth-card::before{
    content:'';
    position:absolute;
    top:0;left:0;right:0;
    height:2px;
    background:linear-gradient(90deg,transparent,#FF6B00,#FF8F1F,#FF6B00,transparent);
    opacity:.9;
  }
  .auth-header{text-align:center;margin-bottom:28px}
  .auth-header h2{
    font-family:'Space Grotesk',sans-serif;
    font-size:1.6rem;
    font-weight:700;
    color:#fff;
    margin-bottom:6px;
    letter-spacing:-.8px;
  }
  .auth-header p{font-size:.85rem;color:rgba(255,255,255,.5);line-height:1.5;font-weight:300}
  .auth-field{margin-bottom:18px;position:relative}
  .auth-field label{
    display:block;
    font-size:.7rem;
    font-weight:600;
    margin-bottom:6px;
    color:rgba(255,255,255,.7);
    letter-spacing:.3px;
    text-transform:uppercase;
    transition:all .3s;
  }
  .input-group{
    position:relative;
    display:flex;
    align-items:center;
  }
  .input-group input{
    width:100%;
    padding:14px 14px 14px 48px;
    border:1.5px solid rgba(255,255,255,.1);
    border-radius:14px;
    font-family:inherit;
    font-size:.9rem;
    background:rgba(255,255,255,.04);
    transition:all .3s cubic-bezier(.4,0,.2,1);
    color:#fff;
  }
  .input-group input::placeholder{color:rgba(255,255,255,.3);font-size:.85rem}
  .input-group input:focus{
    outline:none;
    border-color:rgba(255,107,0,.5);
    background:rgba(255,255,255,.06);
    box-shadow:0 0 0 4px rgba(255,107,0,.08);
  }
  .input-group input.invalid{border-color:#ef4444;box-shadow:0 0 0 4px rgba(239,68,68,.08)}
  .input-icon{
    position:absolute;
    left:16px;
    top:50%;
    transform:translateY(-50%);
    width:18px;
    height:18px;
    color:rgba(255,255,255,.3);
    pointer-events:none;
    transition:all .3s;
  }
  .input-group input:focus ~ .input-icon{color:rgba(255,107,0,.7)}
  .auth-err{
    font-size:.7rem;
    color:#ef4444;
    margin-top:5px;
    display:none;
    font-weight:500;
  }
  .auth-field input.invalid ~ .auth-err{display:block}
  .auth-options{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:20px;
    font-size:.82rem;
  }
  .auth-remember{
    display:flex;
    align-items:center;
    gap:8px;
    color:rgba(255,255,255,.6);
    cursor:pointer;
    transition:all .2s;
  }
  .auth-remember:hover{color:rgba(255,255,255,.8)}
  .auth-remember input[type="checkbox"]{
    width:16px;
    height:16px;
    accent-color:#FF6B00;
    cursor:pointer;
    transition:all .2s;
  }
  .auth-remember input[type="checkbox"]:checked{accent-color:#FF8F1F}
  .auth-forgot{
    color:#FF8F1F;
    text-decoration:none;
    font-weight:500;
    font-size:.82rem;
    transition:all .2s;
  }
  .auth-forgot:hover{color:#FF6B00;text-decoration:underline}
  .auth-btn{
    width:100%;
    padding:15px;
    border-radius:14px;
    border:none;
    font-family:inherit;
    font-weight:600;
    font-size:.95rem;
    cursor:pointer;
    transition:all .3s cubic-bezier(.4,0,.2,1);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    position:relative;
    overflow:hidden;
  }
  .auth-btn-primary{
    background:linear-gradient(135deg,#FF6B00,#FF8F1F);
    color:#fff;
    box-shadow:0 4px 24px rgba(255,107,0,.35);
    margin-top:4px;
  }
  .auth-btn-primary:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 32px rgba(255,107,0,.45);
  }
  .auth-btn-primary:active{transform:translateY(0)}
  .auth-divider{
    display:flex;
    align-items:center;
    gap:12px;
    margin:20px 0;
    color:rgba(255,255,255,.4);
    font-size:.75rem;
    font-weight:500;
  }
  .auth-divider::before,.auth-divider::after{
    content:'';
    flex:1;
    height:1px;
    background:rgba(255,255,255,.08);
  }
  .auth-btn-google{
    background:rgba(255,255,255,.06);
    color:#fff;
    border:1.5px solid rgba(255,255,255,.1);
    backdrop-filter:blur(10px);
  }
  .auth-btn-google:hover{
    background:rgba(255,255,255,.1);
    border-color:rgba(255,255,255,.2);
    transform:translateY(-1px);
    box-shadow:0 4px 16px rgba(0,0,0,.2);
  }
  .auth-btn-google svg{width:18px;height:18px;flex-shrink:0}
  .auth-switch{
    text-align:center;
    margin-top:18px;
    font-size:.85rem;
    color:rgba(255,255,255,.5);
  }
  .auth-switch a{
    color:#FF8F1F;
    font-weight:600;
    text-decoration:none;
  }
  .auth-switch a:hover{color:#FF6B00;text-decoration:underline}
  .auth-success{
    text-align:center;
    padding:50px 20px;
    display:none;
  }
  .auth-success .as-icon{
    width:56px;
    height:56px;
    border-radius:50%;
    background:linear-gradient(135deg,#22c55e,#16a34a);
    display:grid;
    place-items:center;
    margin:0 auto 16px;
    font-size:1.6rem;
    color:#fff;
    box-shadow:0 8px 32px rgba(34,197,94,.4);
    animation:scaleIn .5s cubic-bezier(.16,1,.3,1) both;
  }
  @keyframes scaleIn{
    from{opacity:0;transform:scale(.5)}
    to{opacity:1;transform:scale(1)}
  }
  .auth-success h3{
    font-family:'Space Grotesk',sans-serif;
    font-size:1.3rem;
    font-weight:700;
    margin-bottom:6px;
    color:#fff;
  }
  .auth-success p{color:rgba(255,255,255,.6);font-size:.9rem;font-weight:300}

  @media(max-width:520px){
    .auth-wrapper{padding:12px}
    .auth-card{padding:28px 20px 24px;border-radius:20px}
    .auth-header h2{font-size:1.35rem}
    .input-group input{padding:12px 12px 12px 42px;font-size:16px}
    .auth-btn{padding:13px;font-size:.9rem}
    .auth-logo{margin-bottom:14px}
    .auth-logo img{height:24px}
    .auth-logo span{font-size:.85rem}
  }
  @media(min-width:521px) and (max-width:900px){
    .auth-card{padding:32px 28px 28px}
  }
  @media(max-height:700px){
    .auth-wrapper{padding:10px}
    .auth-card{padding:24px 20px 20px}
    .auth-header{margin-bottom:18px}
    .auth-field{margin-bottom:12px}
    .input-group input{padding:11px 12px 11px 42px}
    .auth-btn{padding:12px}
    .auth-divider{margin:14px 0}
    .auth-switch{margin-top:12px}
  }
</style>
</head>
<body>
<div class="auth-loader" id="ldr">
  <div class="auth-ring"></div>
  <div class="auth-logo-mark">Learn<span>X</span></div>
</div>
<div class="bg-scene">
  <div class="bg-orb o1"></div>
  <div class="bg-orb o2"></div>
  <div class="bg-orb o3"></div>
  <div class="bg-grid"></div>
</div>

<div class="auth-wrapper">
  <a href="index.html" class="auth-logo">
    <img src="images/Logo.png" alt="Learn X Community">
    <span>Learn X Community</span>
  </a>
  <div class="auth-card">
    <div class="auth-header">
      <h2>Welcome Back</h2>
      <p>Login to continue your learning journey</p>
    </div>
    <form id="loginForm" autocomplete="off">
      <div class="auth-field">
        <label for="liEmail">Email or Phone</label>
        <div class="input-group">
          <input type="text" id="liEmail" placeholder="you@example.com or phone" required>
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 7l-10 6L2 7"/></svg>
        </div>
        <div class="auth-err">Please enter your email or phone</div>
      </div>
      <div class="auth-field">
        <label for="liPassword">Password</label>
        <div class="input-group">
          <input type="password" id="liPassword" placeholder="Enter your password" required>
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
        </div>
        <div class="auth-err">Please enter your password</div>
      </div>
      <div class="auth-options">
        <label class="auth-remember">
          <input type="checkbox">
          <span>Remember me</span>
        </label>
        <a href="#" class="auth-forgot">Forgot password?</a>
      </div>
      <button type="submit" class="auth-btn auth-btn-primary">Login</button>
      <div class="auth-divider">or continue with</div>
      <button type="button" class="auth-btn auth-btn-google" id="googleLogin">
        <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Continue with Google
      </button>
      <div class="auth-switch">Don't have an account? <a href="signup.html">Sign up</a></div>
    </form>
    <div class="auth-success" id="authSuccess">
      <div class="as-icon">✓</div>
      <h3>Welcome Back!</h3>
      <p>You have been logged in successfully.</p>
    </div>
  </div>
</div>

<script src="supabase-config.js"></script>
<script type="module" src="auth.js"></script>
<script>
(function(){
  // Hide loader fast (perceived speed)
  var ldr=document.getElementById('ldr');
  function hide(){ if(ldr) ldr.classList.add('hidden'); }
  window.addEventListener('load',function(){ setTimeout(hide,150); });
  setTimeout(hide,1200);

  // Load Supabase config + auth module, then resolve once AUTH/DB are live
  // auth.js is loaded eagerly as a module in <head>; just wait until AUTH/DB are live
  function loadAuth(){
    if(window.AUTH&&window.DB) return Promise.resolve(true);
    return waitAuth();
  }
  function waitAuth(){
    return new Promise(function(res){
      var w=0;(function c(){ if(window.AUTH&&window.DB) return res(true); if(w>=8000){ console.warn('AUTH never initialised'); return res(false);} w+=120; setTimeout(c,120); })();
    });
  }

  function getVal(id){return document.getElementById(id).value.trim()}
  function setInvalid(id,on){document.getElementById(id).classList.toggle('invalid',!!on);}
  function showErr(id,on){var f=document.getElementById(id).closest('.auth-field');var e=f.querySelector('.auth-err');e.style.display=on?'block':'none';}
  function success(){hide();document.getElementById('loginForm').style.display='none';document.getElementById('authSuccess').style.display='block';setTimeout(function(){window.location.href='index.html';},1600);}

  document.getElementById('loginForm').addEventListener('submit',function(e){
    e.preventDefault();
    var emailOrPhone=getVal('liEmail'),password=getVal('liPassword');
    var valid=true;
    if(!emailOrPhone){setInvalid('liEmail',1);showErr('liEmail',1);valid=false;}else{setInvalid('liEmail',0);showErr('liEmail',0);}
    if(!password){setInvalid('liPassword',1);showErr('liPassword',1);valid=false;}else{setInvalid('liPassword',0);showErr('liPassword',0);}
    if(!valid)return;
    if(/^\d{10,}$/.test(emailOrPhone.replace(/[\s\-()]/g,''))){
      alert('Login with phone number requires Google sign-in or please use your email.');
      return;
    }
    loadAuth().then(function(ok){
      if(ok&&window.AUTH){
        window.AUTH.emailLogin(emailOrPhone,password).then(success).catch(function(err){
          alert('Login failed: '+err.message+'\n\nIf you signed up with Google, please use the "Continue with Google" button.');
        });
      } else { success(); }
    });
  });
  document.getElementById('googleLogin').addEventListener('click',function(){
    loadAuth().then(function(ok){
      if(ok&&window.AUTH){
        // Supabase OAuth redirects to Google then back to the site
        window.AUTH.googleLogin().catch(function(err){
          if(err&&err.message) alert('Google login failed: '+err.message);
        });
      } else { alert('Google sign-in needs the auth service. Please retry in a moment.'); }
    });
  });
}());
</script>
</body>
</html>
